name: Release firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v1.0.4
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Verify release version
        id: version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the form v1.2.3, got: $RELEASE_TAG" >&2
            exit 1
          fi

          version="$(sed -nE 's/^#define FIRMWARE_VERSION "([^"]+)"/\1/p' src/main.cpp)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match FIRMWARE_VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create CI secrets placeholder
        run: cp include/secrets.example.h include/secrets.h

      - name: Build firmware
        run: pio run -e lilygo-t-can485

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          base="GMK330Emulator_v${{ steps.version.outputs.version }}_LilygoT-CAN485"
          cp .pio/build/lilygo-t-can485/firmware.bin "release/${base}.ota.bin"
          cd release
          sha256sum "${base}.ota.bin" > "GMK330Emulator_v${{ steps.version.outputs.version }}_SHA256SUMS.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
